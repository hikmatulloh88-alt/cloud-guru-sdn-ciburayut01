name: Build Cloud Guru AI Studio APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-ai-studio/**'
      - '.github/workflows/android-ai-studio-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-ai-studio
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-guru-ai-studio-debug-apk
          path: android-ai-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
