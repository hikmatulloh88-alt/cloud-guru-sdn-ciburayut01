---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sdncibur/public_html/
    - /bin/mkdir -p $DEPLOYPATH/includes
    - /bin/cp includes/auth.php $DEPLOYPATH/includes/auth.php
    - /bin/cp includes/csrf.php $DEPLOYPATH/includes/csrf.php
    - /bin/cp includes/sidebar.php $DEPLOYPATH/includes/sidebar.php
    - /bin/mkdir -p $DEPLOYPATH/auth
    - /bin/cp auth/login.php $DEPLOYPATH/auth/login.php
    - /bin/cp auth/logout.php $DEPLOYPATH/auth/logout.php
    - /bin/mkdir -p $DEPLOYPATH/admin/tampilan
    - /bin/cp admin/tampilan/upload_page_image.php $DEPLOYPATH/admin/tampilan/upload_page_image.php
    - /bin/mkdir -p $DEPLOYPATH/ai-studio
    - /bin/cp ai-studio/index.php $DEPLOYPATH/ai-studio/index.php
    - /bin/cp ai-studio/generate.php $DEPLOYPATH/ai-studio/generate.php
    - /bin/cp ai-studio/status.php $DEPLOYPATH/ai-studio/status.php
    - /bin/mkdir -p $DEPLOYPATH/self-healing
    - /bin/cp self-healing/logger.php $DEPLOYPATH/self-healing/
    - /bin/cp self-healing/patch_engine.php $DEPLOYPATH/self-healing/
    - /bin/cp self-healing/dashboard.php $DEPLOYPATH/self-healing/
    - /bin/cp self-healing/admin.php $DEPLOYPATH/self-healing/
    - /bin/mkdir -p $DEPLOYPATH/gdrive
    - /bin/cp gdrive/connect.php $DEPLOYPATH/gdrive/
    - /bin/cp gdrive/callback.php $DEPLOYPATH/gdrive/
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp config/google_drive_lib.php $DEPLOYPATH/config/
    - /bin/cp config/google_drive_lib.php $DEPLOYPATH/config/google_drive_lib.php
    - /bin/chmod 644 $DEPLOYPATH/config/google_drive_lib.php
    - /bin/cp config/school_stats.php $DEPLOYPATH/config/
    - /bin/mkdir -p $DEPLOYPATH/assets/css
    - /bin/mkdir -p $DEPLOYPATH/assets/js
    - /bin/cp assets/js/page-image-upload.js $DEPLOYPATH/assets/js/page-image-upload.js
    - /bin/cp assets/js/visual-settings.js $DEPLOYPATH/assets/js/visual-settings.js
    - /bin/cp assets/css/cloud-guru-public-overrides.css $DEPLOYPATH/assets/css/cloud-guru-public-overrides.css
    - /bin/cp index.php $DEPLOYPATH/index.php
    - /bin/mkdir -p $DEPLOYPATH/storage
    - /bin/cp storage/index.php $DEPLOYPATH/storage/
    - /bin/cp storage/upload.php $DEPLOYPATH/storage/
    - /bin/cp storage/delete.php $DEPLOYPATH/storage/
    - /bin/cp storage/download.php $DEPLOYPATH/storage/
    - /bin/cp storage/thumbnail.php $DEPLOYPATH/storage/
    - /bin/mkdir -p $DEPLOYPATH/auth
    - /bin/mkdir -p $DEPLOYPATH/builder
    - /bin/cp builder/index.php $DEPLOYPATH/builder/index.php
    - /bin/cp builder/settings.php $DEPLOYPATH/builder/settings.php
    - if [ -f "$DEPLOYPATH/admin/tampilan/index.php" ]; then /usr/bin/perl -0pi -e 's{<a\b(?:(?!</a>).)*Buka Website Builder(?:(?!</a>).)*</a>}{}is' "$DEPLOYPATH/admin/tampilan/index.php"; fi
    - if [ -f "$DEPLOYPATH/admin/tampilan/index.php" ]; then /usr/bin/perl -0pi -e 's{</body>}{<script src="/assets/js/page-image-upload.js" defer></script></body>}i unless /page-image-upload\.js/' "$DEPLOYPATH/admin/tampilan/index.php"; fi
    - if [ -f "$DEPLOYPATH/admin/tampilan/index.php" ]; then /usr/bin/perl -0pi -e 's{(<a\b(?:(?!</a>).)*Buka Website Publik(?:(?!</a>).)*</a>)}{$1<a href="/builder/" style="display:inline-block;padding:10px 12px;border:1px solid lightgray;border-radius:9px;font-weight:750;color:navy;background:white">🧱 Editor Visual</a>}is unless /Editor Visual/' "$DEPLOYPATH/admin/tampilan/index.php"; fi
